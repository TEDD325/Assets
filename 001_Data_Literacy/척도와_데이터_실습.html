<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>척도와 데이터 유형 실습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F5F4F0; --surface: #FFFFFF; --surface2: #EEECE8; --border: #E0DDD8;
  --text-p: #1A1917; --text-s: #5C5955; --text-t: #9C9894;
  /* 척도 */
  --s1: #7F77DD; --s1-bg: #EEEDFE; --s1-dk: #3C3489; --s1-mid: #AFA9EC;
  --s2: #1D9E75; --s2-bg: #E1F5EE; --s2-dk: #085041; --s2-mid: #5DCAA5;
  --s3: #BA7517; --s3-bg: #FAEEDA; --s3-dk: #633806; --s3-mid: #EF9F27;
  --s4: #D85A30; --s4-bg: #FAECE7; --s4-dk: #4A1B0C; --s4-mid: #F0997B;
  /* 데이터 유형 */
  --d1: #378ADD; --d1-bg: #E6F1FB; --d1-dk: #0C447C; --d1-mid: #7AB4E8;
  --d2: #639922; --d2-bg: #EAF3DE; --d2-dk: #173404; --d2-mid: #97C459;
  --d3: #D4537E; --d3-bg: #FBEAF0; --d3-dk: #4B1528; --d3-mid: #E98AAD;
  --d4: #888780; --d4-bg: #F1EFE8; --d4-dk: #2C2C2A; --d4-mid: #B2B0A8;
  --r: 10px; --r-lg: 16px;
}
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text-p); font-size: 15px; line-height: 1.7; }
.container { max-width: 720px; margin: 0 auto; padding: 52px 24px 88px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-t); margin-bottom: 8px; }
h1 { font-size: 28px; font-weight: 700; line-height: 1.25; margin-bottom: 10px; }
.subtitle { font-size: 14px; color: var(--text-s); line-height: 1.75; max-width: 560px; margin-bottom: 28px; }
.subtitle strong { font-weight: 600; color: var(--text-p); }

/* Tabs */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.tab-btn {
  padding: 8px 18px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif;
  font-weight: 600; border: 1.5px solid var(--border); border-radius: var(--r);
  background: var(--surface); color: var(--text-s); cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.tab-btn:hover { border-color: var(--text-t); color: var(--text-p); }
.tab-btn.active { background: var(--text-p); color: #fff; border-color: var(--text-p); }

/* Progress */
.prog-wrap { background: var(--surface2); border-radius: 999px; height: 5px; margin-bottom: 6px; }
.prog-fill { height: 5px; border-radius: 999px; transition: width 0.4s; }
.prog-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-t); margin-bottom: 24px; }

/* Quiz card */
.qcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 26px 26px 22px; margin-bottom: 14px; }
.q-num { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-t); margin-bottom: 12px; }
.q-ctx { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-t); margin-bottom: 5px; }
.q-val { font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 700; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); padding: 13px 17px; display: inline-block; margin-bottom: 6px; }
.q-hint { font-size: 13px; color: var(--text-s); margin-top: 8px; line-height: 1.65; }

/* Options 2-col */
.opts2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 18px; }
/* Options 1-col */
.opts1 { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.opt {
  border: 2px solid var(--border); border-radius: var(--r); background: var(--surface);
  padding: 11px 15px; cursor: pointer; text-align: left; transition: all 0.15s;
  display: flex; align-items: center; gap: 10px;
}
.opt:hover:not(:disabled) { border-color: var(--text-t); background: var(--surface2); }
.opt .opt-badge { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.opt .opt-main { font-size: 13px; font-weight: 600; color: var(--text-p); }
.opt .opt-sub  { font-size: 11px; color: var(--text-t); margin-top: 1px; }
.opt.correct { border-color: var(--s2); background: var(--s2-bg); }
.opt.wrong   { border-color: var(--s4); background: var(--s4-bg); }
.opt.dim     { opacity: 0.38; }
.opt:disabled { cursor: default; }

/* OX Options */
.opts-ox { display: flex; gap: 12px; margin-top: 18px; }
.ox-btn {
  flex: 1; border: 2px solid var(--border); border-radius: var(--r-lg); background: var(--surface);
  padding: 18px; cursor: pointer; text-align: center; transition: all 0.15s; font-family: 'Noto Sans KR', sans-serif;
}
.ox-btn:hover:not(:disabled) { border-color: var(--text-t); }
.ox-btn .ox-icon { font-size: 36px; line-height: 1; margin-bottom: 6px; }
.ox-btn .ox-label { font-size: 14px; font-weight: 700; color: var(--text-p); }
.ox-btn.correct { border-color: var(--s2); background: var(--s2-bg); }
.ox-btn.wrong   { border-color: var(--s4); background: var(--s4-bg); }
.ox-btn.dim     { opacity: 0.38; }
.ox-btn:disabled { cursor: default; }

/* Feedback */
.fb { margin-top: 14px; border-radius: var(--r); padding: 13px 15px; font-size: 13px; line-height: 1.75; display: none; }
.fb.vis { display: flex; gap: 10px; align-items: flex-start; }
.fb.ok   { background: var(--s2-bg); border: 1px solid var(--s2-mid); color: var(--s2-dk); }
.fb.fail { background: var(--s4-bg); border: 1px solid var(--s4-mid); color: var(--s4-dk); }
.fb strong { font-weight: 700; }

/* Next btn */
.next-btn { display: none; width: 100%; margin-top: 12px; padding: 12px; border-radius: var(--r); border: none; background: var(--text-p); color: #fff; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
.next-btn:hover { opacity: 0.85; }
.next-btn.vis { display: block; }

/* Result */
.result { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 36px 28px; text-align: center; display: none; }
.result.vis { display: block; }
.res-score { font-size: 50px; font-weight: 700; line-height: 1; margin-bottom: 8px; }
.res-sub { font-size: 15px; color: var(--text-s); margin-bottom: 20px; }
.res-grade { display: inline-block; padding: 6px 20px; border-radius: 999px; font-size: 14px; font-weight: 700; margin-bottom: 28px; }
.retry-btn { padding: 12px 32px; border-radius: var(--r); border: 2px solid var(--border); background: var(--surface); font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 600; color: var(--text-p); cursor: pointer; }
.retry-btn:hover { background: var(--surface2); }

/* Ref pills */
.ref-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.ref-pill { font-size: 12px; font-weight: 600; padding: 3px 11px; border-radius: 999px; }
</style>
</head>
<body>
<div class="container">

  <p class="eyebrow">데이터 분석 기초 · 측정 이론</p>
  <h1>척도와 데이터 유형 실습</h1>
  <p class="subtitle">세 가지 모드로 연습합니다. <strong>탭을 눌러</strong> 원하는 유형을 선택하세요.</p>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchMode('dtype')">🔢 데이터 유형 분류</button>
    <button class="tab-btn" onclick="switchMode('combined')">🔗 척도 + 유형 통합</button>
    <button class="tab-btn" onclick="switchMode('analysis')">✅ 분석 가능성 OX</button>
  </div>

  <!-- ─── Mode A: 데이터 유형 분류 ─── -->
  <div id="mode-dtype">
    <div class="ref-row">
      <span class="ref-pill" style="background:var(--d1-bg);color:var(--d1-dk);">이산형 — 셀 수 있는 정수</span>
      <span class="ref-pill" style="background:var(--d2-bg);color:var(--d2-dk);">연속형 — 측정하는 소수값</span>
      <span class="ref-pill" style="background:var(--d3-bg);color:var(--d3-dk);">명목형 — 순서 없는 범주</span>
      <span class="ref-pill" style="background:var(--d4-bg);color:var(--d4-dk);">순서형 — 순서 있는 범주</span>
    </div>
    <div class="prog-wrap"><div class="prog-fill" id="dtype-prog" style="width:0%; background:var(--d1);"></div></div>
    <div class="prog-meta"><span id="dtype-meta">0 / 10 완료</span><span id="dtype-score">정답 0개</span></div>
    <div id="dtype-area">
      <div class="qcard" id="dtype-card">
        <p class="q-num" id="dtype-qnum"></p>
        <p class="q-ctx" id="dtype-ctx"></p>
        <div class="q-val" id="dtype-val"></div>
        <p class="q-hint" id="dtype-hint"></p>
        <div class="opts2" id="dtype-opts"></div>
        <div class="fb" id="dtype-fb"></div>
        <button class="next-btn" id="dtype-next" onclick="dtypeNext()">다음 문제 →</button>
      </div>
    </div>
    <div class="result" id="dtype-result">
      <div class="res-score" id="dtype-rscore"></div>
      <div class="res-sub" id="dtype-rsub"></div>
      <div class="res-grade" id="dtype-rgrade"></div>
      <button class="retry-btn" onclick="dtypeStart()">다시 풀기</button>
    </div>
  </div>

  <!-- ─── Mode B: 척도 + 유형 통합 ─── -->
  <div id="mode-combined" style="display:none;">
    <div class="ref-row">
      <span class="ref-pill" style="background:var(--s1-bg);color:var(--s1-dk);">명목척도 = 명목형</span>
      <span class="ref-pill" style="background:var(--s2-bg);color:var(--s2-dk);">서열척도 = 순서형</span>
      <span class="ref-pill" style="background:var(--s3-bg);color:var(--s3-dk);">등간척도 = 연속형 + 0 없음</span>
      <span class="ref-pill" style="background:var(--s4-bg);color:var(--s4-dk);">비율척도 = 연속/이산 + 0 있음</span>
    </div>
    <div class="prog-wrap"><div class="prog-fill" id="comb-prog" style="width:0%; background:var(--s4);"></div></div>
    <div class="prog-meta"><span id="comb-meta">0 / 10 완료</span><span id="comb-score">정답 0개</span></div>
    <div id="comb-area">
      <div class="qcard" id="comb-card">
        <p class="q-num" id="comb-qnum"></p>
        <p class="q-ctx" id="comb-ctx"></p>
        <div class="q-val" id="comb-val"></div>
        <p class="q-hint" id="comb-hint"></p>
        <div id="comb-step" style="margin-top:14px; font-size:12px; font-weight:600; color:var(--text-t); text-transform:uppercase; letter-spacing:.07em;"></div>
        <div class="opts2" id="comb-opts"></div>
        <div class="fb" id="comb-fb"></div>
        <button class="next-btn" id="comb-next" onclick="combNext()">다음 문제 →</button>
      </div>
    </div>
    <div class="result" id="comb-result">
      <div class="res-score" id="comb-rscore"></div>
      <div class="res-sub" id="comb-rsub"></div>
      <div class="res-grade" id="comb-rgrade"></div>
      <button class="retry-btn" onclick="combStart()">다시 풀기</button>
    </div>
  </div>

  <!-- ─── Mode C: 분석 가능성 OX ─── -->
  <div id="mode-analysis" style="display:none;">
    <p class="subtitle" style="margin-bottom:16px;">제시된 분석 문장이 <strong>올바른지(O)</strong> 또는 <strong>잘못된지(X)</strong> 판단하세요.</p>
    <div class="prog-wrap"><div class="prog-fill" id="ana-prog" style="width:0%; background:#1A1917;"></div></div>
    <div class="prog-meta"><span id="ana-meta">0 / 10 완료</span><span id="ana-score">정답 0개</span></div>
    <div id="ana-area">
      <div class="qcard" id="ana-card">
        <p class="q-num" id="ana-qnum"></p>
        <p class="q-ctx" id="ana-ctx"></p>
        <div class="q-val" id="ana-val" style="font-size:15px; font-family:'Noto Sans KR',sans-serif; max-width:100%;"></div>
        <div class="opts-ox" id="ana-opts"></div>
        <div class="fb" id="ana-fb"></div>
        <button class="next-btn" id="ana-next" onclick="anaNext()">다음 문제 →</button>
      </div>
    </div>
    <div class="result" id="ana-result">
      <div class="res-score" id="ana-rscore"></div>
      <div class="res-sub" id="ana-rsub"></div>
      <div class="res-grade" id="ana-rgrade"></div>
      <button class="retry-btn" onclick="anaStart()">다시 풀기</button>
    </div>
  </div>

</div>

<script>
/* ══════════════════════════════════════
   공통 유틸
══════════════════════════════════════ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function grade(pct, labelFn) { return labelFn(pct); }
function showResult(scoreEl, subEl, gradeEl, resultEl, quizArea, sc, tot) {
  quizArea.style.display = 'none';
  const pct = Math.round(sc / tot * 100);
  scoreEl.textContent = sc + ' / ' + tot;
  subEl.textContent = '정답률 ' + pct + '%';
  let g, bg, col;
  if (pct >= 90) { g = '마스터 🏆'; bg = '#1A1917'; col = '#fff'; }
  else if (pct >= 70) { g = '잘 이해했어요 👍'; bg = '#E1F5EE'; col = '#085041'; }
  else if (pct >= 50) { g = '조금 더 복습해요 📖'; bg = '#FAEEDA'; col = '#633806'; }
  else { g = '개념을 다시 확인해요 💪'; bg = '#FAECE7'; col = '#4A1B0C'; }
  gradeEl.textContent = g;
  gradeEl.style.background = bg; gradeEl.style.color = col;
  resultEl.classList.add('vis');
}

function switchMode(m) {
  ['dtype','combined','analysis'].forEach(function(id) {
    document.getElementById('mode-' + id).style.display = id === m ? 'block' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach(function(btn, i) {
    btn.classList.toggle('active', ['dtype','combined','analysis'][i] === m);
  });
}

/* ══════════════════════════════════════
   MODE A — 데이터 유형 분류
══════════════════════════════════════ */
const DTYPE_OPTS = [
  { label:'이산형', sub:'셀 수 있는 정수', color:'var(--d1)', bg:'var(--d1-bg)', dk:'var(--d1-dk)', icon:'🔢' },
  { label:'연속형', sub:'측정하는 소수값', color:'var(--d2)', bg:'var(--d2-bg)', dk:'var(--d2-dk)', icon:'📈' },
  { label:'명목형', sub:'순서 없는 범주', color:'var(--d3)', bg:'var(--d3-bg)', dk:'var(--d3-dk)', icon:'🏷️' },
  { label:'순서형', sub:'순서 있는 범주', color:'var(--d4)', bg:'var(--d4-bg)', dk:'var(--d4-dk)', icon:'🥇' },
];
const DTYPE_QS = [
  { ctx:'물류 데이터', val:'배송 완료 건수', hint:'하루에 몇 건을 배송 완료했는지 셀 수 있습니다.', ans:0, fb:'건수처럼 <strong>하나씩 셀 수 있고 소수 불가</strong>한 데이터는 이산형입니다.' },
  { ctx:'신체 측정', val:'체온: 36.7°C', hint:'소수점으로 더 정밀하게 측정할 수 있습니다.', ans:1, fb:'온도는 36.7, 36.72처럼 <strong>소수점이 가능한 연속값</strong>입니다. 연속형입니다.' },
  { ctx:'고객 속성', val:'국적: "대한민국"', hint:'"대한민국"과 "미국" 사이에 순서가 있을까요?', ans:2, fb:'국적은 <strong>순서 없이 종류만 구분</strong>하는 명목형 데이터입니다.' },
  { ctx:'서비스 평가', val:'서비스 만족도: "매우 불만족"', hint:'"매우 불만족" < "불만족" < "보통" < "만족" < "매우 만족" 순서가 있습니다.', ans:3, fb:'순서가 있는 범주형 데이터이므로 <strong>순서형</strong>입니다. 단, 간격이 균일하지는 않습니다.' },
  { ctx:'쇼핑몰 로그', val:'장바구니 추가 횟수: 5회', hint:'1회, 2회, 3회… 소수점이 없습니다.', ans:0, fb:'횟수는 <strong>정수만 존재</strong>하는 이산형 데이터입니다.' },
  { ctx:'마케팅 데이터', val:'광고 채널: "SNS"', hint:'"SNS", "검색광고", "이메일" 사이에 대소 관계가 있을까요?', ans:2, fb:'광고 채널은 <strong>종류를 구분</strong>하는 것으로 순서가 없는 명목형입니다.' },
  { ctx:'금융 데이터', val:'대출 이자율: 3.75%', hint:'이자율은 0.01%씩 무한히 세분화될 수 있습니다.', ans:1, fb:'이자율은 소수점을 가지며 <strong>연속적으로 변하는 연속형</strong>입니다.' },
  { ctx:'인사 데이터', val:'직급: "과장"', hint:'"사원 < 대리 < 과장 < 차장 < 부장" 순서가 있습니다.', ans:3, fb:'직급은 순서가 있는 범주이므로 <strong>순서형</strong>입니다.' },
  { ctx:'헬스 앱', val:'오늘 걸음 수: 7,432보', hint:'걸음은 하나씩 세는 값입니다.', ans:0, fb:'걸음 수는 정수로만 존재하는 <strong>이산형</strong>입니다. (7432.5보는 불가)' },
  { ctx:'날씨 데이터', val:'강수량: 12.4mm', hint:'강수량은 더 정밀하게 측정할수록 소수가 됩니다.', ans:1, fb:'강수량은 소수점 값이 가능하며 <strong>연속형</strong>입니다.' },
];

let dtypeQ = [], dtypeCur = 0, dtypeSc = 0, dtypeAnswered = false;

function dtypeStart() {
  dtypeQ = shuffle(DTYPE_QS); dtypeCur = 0; dtypeSc = 0; dtypeAnswered = false;
  document.getElementById('dtype-result').classList.remove('vis');
  document.getElementById('dtype-area').style.display = 'block';
  dtypeRender();
}

function dtypeRender() {
  const q = dtypeQ[dtypeCur], tot = dtypeQ.length;
  document.getElementById('dtype-prog').style.width = (dtypeCur / tot * 100) + '%';
  document.getElementById('dtype-meta').textContent = dtypeCur + ' / ' + tot + ' 완료';
  document.getElementById('dtype-score').textContent = '정답 ' + dtypeSc + '개';
  document.getElementById('dtype-qnum').textContent = '문제 ' + (dtypeCur + 1) + ' / ' + tot;
  document.getElementById('dtype-ctx').textContent = '📂 ' + q.ctx;
  document.getElementById('dtype-val').textContent = q.val;
  document.getElementById('dtype-hint').textContent = q.hint;
  const opts = document.getElementById('dtype-opts');
  opts.innerHTML = DTYPE_OPTS.map(function(o, i) {
    return '<button class="opt" onclick="dtypeAnswer(' + i + ')" id="dopt-' + i + '">' +
      '<div class="opt-badge" style="background:' + o.color + '; color:#fff;">' + o.icon + '</div>' +
      '<div><div class="opt-main" style="color:' + o.dk + '">' + o.label + '</div><div class="opt-sub">' + o.sub + '</div></div>' +
      '</button>';
  }).join('');
  const fb = document.getElementById('dtype-fb');
  fb.className = 'fb'; fb.innerHTML = '';
  document.getElementById('dtype-next').className = 'next-btn';
  dtypeAnswered = false;
}

function dtypeAnswer(idx) {
  if (dtypeAnswered) return;
  dtypeAnswered = true;
  const q = dtypeQ[dtypeCur], ok = idx === q.ans;
  if (ok) dtypeSc++;
  DTYPE_OPTS.forEach(function(_, i) {
    const btn = document.getElementById('dopt-' + i);
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
    else if (i === idx && !ok) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });
  const fb = document.getElementById('dtype-fb');
  fb.className = 'fb vis ' + (ok ? 'ok' : 'fail');
  fb.innerHTML = (ok ? '✅ <div><strong>정답!</strong> ' : '❌ <div><strong>오답.</strong> 정답은 <strong>' + DTYPE_OPTS[q.ans].label + '</strong>입니다. ') + q.fb + '</div>';
  document.getElementById('dtype-next').className = 'next-btn vis';
}

function dtypeNext() {
  dtypeCur++;
  if (dtypeCur >= dtypeQ.length) {
    showResult(
      document.getElementById('dtype-rscore'), document.getElementById('dtype-rsub'),
      document.getElementById('dtype-rgrade'), document.getElementById('dtype-result'),
      document.getElementById('dtype-area'), dtypeSc, dtypeQ.length
    ); return;
  }
  dtypeRender();
}

══════════════════════════════════════ */

let combQ = [], combCur = 0, combSc = 0, combStep = 0, combAnswered = false;

function combStart() {
  combQ = shuffle(COMB_QS); combCur = 0; combSc = 0; combStep = 0; combAnswered = false;
  document.getElementById('comb-result').classList.remove('vis');
  document.getElementById('comb-area').style.display = 'block';
  combRender();
}

function combRender() {
  const q = combQ[combCur], tot = combQ.length;
  const display = combCur * 2 + combStep;
  const totalSteps = tot * 2;
  document.getElementById('comb-prog').style.width = (display / totalSteps * 100) + '%';
  document.getElementById('comb-meta').textContent = combCur + ' / ' + tot + ' 완료';
  document.getElementById('comb-score').textContent = '정답 ' + combSc + '개';
  document.getElementById('comb-qnum').textContent = '문제 ' + (combCur + 1) + ' / ' + tot;
  document.getElementById('comb-ctx').textContent = '📂 ' + q.ctx;
  document.getElementById('comb-val').textContent = q.val;
  document.getElementById('comb-hint').textContent = q.hint;

  const opts = document.getElementById('comb-opts');
  const stepEl = document.getElementById('comb-step');
  const fb = document.getElementById('comb-fb');
  fb.className = 'fb'; fb.innerHTML = '';
  document.getElementById('comb-next').className = 'next-btn';
  combAnswered = false;

  if (combStep === 0) {
    stepEl.textContent = '① 데이터 유형을 선택하세요';
    opts.innerHTML = DTYPE_OPTS.map(function(o, i) {
      return '<button class="opt" onclick="combAnswer(' + i + ')" id="copt-' + i + '">' +
        '<div class="opt-badge" style="background:' + o.color + '; color:#fff;">' + o.icon + '</div>' +
        '<div><div class="opt-main" style="color:' + o.dk + '">' + o.label + '</div><div class="opt-sub">' + o.sub + '</div></div>' +
        '</button>';
    }).join('');
  } else {
    stepEl.textContent = '② 척도를 선택하세요';
    opts.innerHTML = COMB_SCALE_OPTS.map(function(o, i) {
      return '<button class="opt" onclick="combAnswer(' + i + ')" id="copt-' + i + '">' +
        '<div class="opt-badge" style="background:' + o.color + '; color:#fff;">' + o.icon + '</div>' +
        '<div><div class="opt-main" style="color:' + o.dk + '">' + o.label + '</div><div class="opt-sub">' + o.sub + '</div></div>' +
        '</button>';
    }).join('');
  }
}

function combAnswer(idx) {
  if (combAnswered) return;
  combAnswered = true;
  const q = combQ[combCur];
  const isStep0 = combStep === 0;
  const correctIdx = isStep0 ? q.dtype : q.scale;
  const optList = isStep0 ? DTYPE_OPTS : COMB_SCALE_OPTS;
  const ok = idx === correctIdx;
  if (ok) combSc++;

  optList.forEach(function(_, i) {
    const btn = document.getElementById('copt-' + i);
    btn.disabled = true;
    if (i === correctIdx) btn.classList.add('correct');
    else if (i === idx && !ok) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  const fb = document.getElementById('comb-fb');
  const fbText = isStep0 ? q.fb_dtype : q.fb_scale;
  const correctLabel = optList[correctIdx].label;
  fb.className = 'fb vis ' + (ok ? 'ok' : 'fail');
  fb.innerHTML = (ok ? '✅ <div><strong>정답!</strong> ' : '❌ <div><strong>오답.</strong> 정답은 <strong>' + correctLabel + '</strong>입니다. ') + fbText + '</div>';
  const nextBtn = document.getElementById('comb-next');
  nextBtn.className = 'next-btn vis';
  nextBtn.textContent = (isStep0 ? '척도 선택 →' : (combCur + 1 < combQ.length ? '다음 문제 →' : '결과 보기'));
}

function combNext() {
  if (combStep === 0) {
    combStep = 1;
    combRender();
  } else {
    combCur++; combStep = 0;
    if (combCur >= combQ.length) {
      showResult(
        document.getElementById('comb-rscore'), document.getElementById('comb-rsub'),
        document.getElementById('comb-rgrade'), document.getElementById('comb-result'),
        document.getElementById('comb-area'), combSc, combQ.length * 2
      ); return;
    }
    combRender();
  }
}

let anaQ = [], anaCur = 0, anaSc = 0, anaAnswered = false;

function anaStart() {
  anaQ = shuffle(ANA_QS); anaCur = 0; anaSc = 0; anaAnswered = false;
  document.getElementById('ana-result').classList.remove('vis');
  document.getElementById('ana-area').style.display = 'block';
  anaRender();
}

function anaRender() {
  const q = anaQ[anaCur], tot = anaQ.length;
  document.getElementById('ana-prog').style.width = (anaCur / tot * 100) + '%';
  document.getElementById('ana-meta').textContent = anaCur + ' / ' + tot + ' 완료';
  document.getElementById('ana-score').textContent = '정답 ' + anaSc + '개';
  document.getElementById('ana-qnum').textContent = '문제 ' + (anaCur + 1) + ' / ' + tot;
  document.getElementById('ana-ctx').textContent = '📂 ' + q.ctx;
  document.getElementById('ana-val').textContent = q.val;
  const opts = document.getElementById('ana-opts');
  opts.innerHTML =
    '<button class="ox-btn" onclick="anaAnswer(true)" id="abtn-o"><div class="ox-icon">⭕</div><div class="ox-label">올바른 분석</div></button>' +
    '<button class="ox-btn" onclick="anaAnswer(false)" id="abtn-x"><div class="ox-icon">❌</div><div class="ox-label">잘못된 분석</div></button>';
  const fb = document.getElementById('ana-fb');
  fb.className = 'fb'; fb.innerHTML = '';
  document.getElementById('ana-next').className = 'next-btn';
  anaAnswered = false;
}

function anaAnswer(val) {
  if (anaAnswered) return;
  anaAnswered = true;
  const q = anaQ[anaCur], ok = val === q.ans;
  if (ok) anaSc++;
  ['o','x'].forEach(function(id) {
    const btn = document.getElementById('abtn-' + id);
    btn.disabled = true;
    const btnVal = id === 'o';
    if (btnVal === q.ans) btn.classList.add('correct');
    else if (btnVal === val && !ok) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });
  const fb = document.getElementById('ana-fb');
  fb.className = 'fb vis ' + (ok ? 'ok' : 'fail');
  fb.innerHTML = (ok ? '✅ <div><strong>정답!</strong> ' : '❌ <div><strong>오답.</strong> ') + q.fb + '</div>';
  document.getElementById('ana-next').className = 'next-btn vis';
}

function anaNext() {
  anaCur++;
  if (anaCur >= anaQ.length) {
    showResult(
      document.getElementById('ana-rscore'), document.getElementById('ana-rsub'),
      document.getElementById('ana-rgrade'), document.getElementById('ana-result'),
      document.getElementById('ana-area'), anaSc, anaQ.length
    ); return;
  }
  anaRender();
}
