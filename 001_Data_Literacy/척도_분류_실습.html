<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>척도 분류 실습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F5F4F0; --surface: #FFFFFF; --surface2: #EEECE8; --border: #E0DDD8;
  --text-p: #1A1917; --text-s: #5C5955; --text-t: #9C9894;
  --c1: #7F77DD; --c1-bg: #EEEDFE; --c1-mid: #AFA9EC; --c1-dark: #3C3489;
  --c2: #1D9E75; --c2-bg: #E1F5EE; --c2-mid: #5DCAA5; --c2-dark: #085041;
  --c3: #BA7517; --c3-bg: #FAEEDA; --c3-mid: #EF9F27; --c3-dark: #633806;
  --c4: #D85A30; --c4-bg: #FAECE7; --c4-mid: #F0997B; --c4-dark: #4A1B0C;
  --r: 10px; --r-lg: 16px;
}
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text-p); line-height: 1.7; font-size: 15px; }
.container { max-width: 720px; margin: 0 auto; padding: 52px 24px 88px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-t); margin-bottom: 8px; }
h1 { font-size: 28px; font-weight: 700; line-height: 1.25; margin-bottom: 10px; }
.subtitle { font-size: 14px; color: var(--text-s); line-height: 1.75; max-width: 560px; margin-bottom: 32px; }
.subtitle strong { font-weight: 600; color: var(--text-p); }

/* Progress */
.progress-bar-wrap { background: var(--surface2); border-radius: 999px; height: 6px; margin-bottom: 6px; }
.progress-bar-fill { height: 6px; border-radius: 999px; background: var(--c2); transition: width 0.4s; }
.progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-t); margin-bottom: 28px; }
.score-badge { font-weight: 600; color: var(--text-s); }

/* Quiz card */
.quiz-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 28px 28px 24px; margin-bottom: 16px; transition: box-shadow 0.2s; }
.q-num { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-t); margin-bottom: 14px; }
.q-context { font-size: 12px; color: var(--text-t); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.q-value { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: var(--text-p); background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 18px; margin-bottom: 6px; display: inline-block; }
.q-desc { font-size: 13px; color: var(--text-s); margin-top: 8px; line-height: 1.65; }

/* Options */
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.opt-btn {
  border: 2px solid var(--border); border-radius: var(--r); background: var(--surface);
  padding: 12px 16px; cursor: pointer; text-align: left; transition: all 0.15s;
  display: flex; align-items: center; gap: 10px;
}
.opt-btn:hover:not(:disabled) { border-color: var(--text-t); background: var(--surface2); }
.opt-btn .opt-num { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; }
.opt-btn .opt-text { font-size: 13px; font-weight: 600; color: var(--text-p); }
.opt-btn .opt-sub { font-size: 11px; color: var(--text-t); margin-top: 1px; }
.opt-btn.correct { border-color: var(--c2); background: var(--c2-bg); }
.opt-btn.wrong   { border-color: #D85A30; background: var(--c4-bg); }
.opt-btn.dim     { opacity: 0.45; }
.opt-btn:disabled { cursor: default; }

/* Feedback */
.feedback { margin-top: 16px; border-radius: var(--r); padding: 14px 16px; font-size: 13px; line-height: 1.75; display: none; }
.feedback.visible { display: flex; gap: 10px; align-items: flex-start; }
.feedback.ok  { background: var(--c2-bg); border: 1px solid var(--c2-mid); color: var(--c2-dark); }
.feedback.fail{ background: var(--c4-bg); border: 1px solid var(--c4-mid); color: var(--c4-dark); }
.feedback strong { font-weight: 700; }

/* Next btn */
.next-btn { display: none; width: 100%; margin-top: 14px; padding: 13px; border-radius: var(--r); border: none; background: var(--text-p); color: #fff; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
.next-btn:hover { opacity: 0.85; }
.next-btn.visible { display: block; }

/* Result */
.result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 36px 28px; text-align: center; display: none; }
.result-card.visible { display: block; }
.result-score { font-size: 52px; font-weight: 700; color: var(--text-p); line-height: 1; margin-bottom: 8px; }
.result-label { font-size: 16px; color: var(--text-s); margin-bottom: 24px; }
.result-grade { display: inline-block; padding: 6px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; margin-bottom: 28px; }
.result-breakdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 28px; }
.rb-cell { border-radius: var(--r); padding: 12px 8px; text-align: center; }
.rb-cell .rb-label { font-size: 11px; font-weight: 600; margin-bottom: 4px; }
.rb-cell .rb-val { font-size: 20px; font-weight: 700; }
.retry-btn { padding: 12px 32px; border-radius: var(--r); border: 2px solid var(--border); background: var(--surface); font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 600; color: var(--text-p); cursor: pointer; transition: background 0.15s; }
.retry-btn:hover { background: var(--surface2); }

/* Ref strip */
.ref-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
.ref-chip { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px; }
</style>
</head>
<body>
<div class="container">

  <p class="eyebrow">데이터 분석 기초 · 측정 이론</p>
  <h1>척도 분류 실습</h1>
  <p class="subtitle">아래 데이터 값을 보고 <strong>명목·서열·등간·비율</strong> 중 어떤 척도인지 선택하세요.<br>총 12문제, 각 문제에 즉시 피드백이 제공됩니다.</p>

  <div class="ref-strip">
    <span class="ref-chip" style="background:var(--c1-bg);color:var(--c1-dark);">① 명목 — 이름만</span>
    <span class="ref-chip" style="background:var(--c2-bg);color:var(--c2-dark);">② 서열 — 순서 있음</span>
    <span class="ref-chip" style="background:var(--c3-bg);color:var(--c3-dark);">③ 등간 — 간격 균일, 0 없음</span>
    <span class="ref-chip" style="background:var(--c4-bg);color:var(--c4-dark);">④ 비율 — 절대 0 있음</span>
  </div>

  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="progress-meta">
    <span id="prog-text">0 / 12 완료</span>
    <span class="score-badge" id="score-text">정답 0개</span>
  </div>

  <div id="quiz-area">
    <div class="quiz-card" id="qcard">
      <p class="q-num" id="q-num"></p>
      <p class="q-context" id="q-context"></p>
      <div class="q-value" id="q-value"></div>
      <p class="q-desc" id="q-desc"></p>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQ()">다음 문제 →</button>
    </div>
  </div>

  <div class="result-card" id="result-card">
    <div class="result-score" id="res-score"></div>
    <div class="result-label" id="res-label"></div>
    <div class="result-grade" id="res-grade"></div>
    <div class="result-breakdown" id="res-breakdown"></div>
    <button class="retry-btn" onclick="restart()">다시 풀기</button>
  </div>

</div>

<script>
const OPTS = [
  { label:'명목척도', sub:'이름·범주', color:'var(--c1)', bg:'var(--c1-bg)', dark:'var(--c1-dark)' },
  { label:'서열척도', sub:'순서 있음', color:'var(--c2)', bg:'var(--c2-bg)', dark:'var(--c2-dark)' },
  { label:'등간척도', sub:'간격 균일', color:'var(--c3)', bg:'var(--c3-bg)', dark:'var(--c3-dark)' },
  { label:'비율척도', sub:'절대 0 존재', color:'var(--c4)', bg:'var(--c4-bg)', dark:'var(--c4-dark)' },
];

const QS = [
  { ctx:'고객 데이터', val:'결제 수단: "신용카드"', desc:'"신용카드"와 "현금" 중 어느 것이 더 크다고 말할 수 있을까요?', ans:0, fb:'결제 수단은 단순히 종류를 구별하는 <strong>이름(범주)</strong>입니다. 순서도 없고 간격도 없으므로 명목척도입니다.' },
  { ctx:'설문 응답', val:'서비스 만족도: 4점 (5점 만점)', desc:'1점 → 2점 상승이 4점 → 5점 상승과 심리적으로 동일한 거리일까요?', ans:1, fb:'리커트 척도(1~5점)는 순서는 있지만 <strong>간격이 반드시 균일하지 않습니다.</strong> 서열척도로 분류합니다.' },
  { ctx:'기상 데이터', val:'오늘 기온: 18°C', desc:'0°C는 "온도가 전혀 없음"을 의미하지 않습니다.', ans:2, fb:'섭씨 온도는 간격이 균일하지만 <strong>0°C가 절대적 없음이 아닙니다.</strong> "18°C는 9°C의 2배"라고 할 수 없으므로 등간척도입니다.' },
  { ctx:'판매 실적', val:'이번 달 매출: 3,200,000원', desc:'매출 0원은 진짜로 "판매가 없었음"을 의미합니다.', ans:3, fb:'매출액은 <strong>0이 진짜 없음</strong>을 뜻하고, "200만 원은 100만 원의 2배"처럼 비율 해석이 가능합니다. 비율척도입니다.' },
  { ctx:'고객 속성', val:'혈액형: "B형"', desc:'"B형"이 "A형"보다 수치적으로 크다고 할 수 있을까요?', ans:0, fb:'혈액형은 단순히 <strong>종류를 구분</strong>하는 범주입니다. 순서나 크기 비교가 불가능한 명목척도입니다.' },
  { ctx:'회원 등급', val:'등급: "골드"', desc:'브론즈 < 실버 < 골드 < VIP 순서는 있지만, 등급 간 실제 차이가 균일한지는 알 수 없습니다.', ans:1, fb:'회원 등급은 <strong>순위는 명확</strong>하지만 등급 사이의 간격이 동일하다고 보장되지 않습니다. 서열척도입니다.' },
  { ctx:'물류 데이터', val:'배송 시간: 47분', desc:'배송 시간 0분은 "배송이 없음"을 의미합니다.', ans:3, fb:'시간은 <strong>0이 절대적 없음</strong>을 뜻하며 "2배 오래 걸렸다"는 표현이 가능합니다. 비율척도입니다.' },
  { ctx:'교육 데이터', val:'IQ 점수: 115', desc:'IQ 0은 존재하지 않으며, 설계상 기준점(평균 100)에서의 거리를 나타냅니다.', ans:2, fb:'IQ는 간격이 균일하지만 <strong>절대적 0이 없는</strong> 표준화 점수입니다. "IQ 120은 IQ 60의 2배 지능"이라고 할 수 없으므로 등간척도입니다.' },
  { ctx:'인구 통계', val:'거주 지역: "부산"', desc:'"서울", "부산", "제주" 중 어느 지역이 더 크거나 우월할까요?', ans:0, fb:'지역은 단순히 <strong>범주를 구분</strong>하는 이름입니다. 순서나 수치적 의미가 없는 명목척도입니다.' },
  { ctx:'재고 관리', val:'재고 수량: 0개', desc:'재고가 0개라는 것은 "재고가 전혀 없다"는 의미입니다.', ans:3, fb:'수량에서 0은 <strong>진짜 없음</strong>입니다. "100개는 50개의 2배"처럼 비율 비교가 가능하므로 비율척도입니다.' },
  { ctx:'학업 성적', val:'학점: "A+"', desc:'A+ > A > B+ > B … 순서는 명확하지만 A+와 A 사이, A와 B+ 사이의 학업 능력 차이가 동일한지는 불분명합니다.', ans:1, fb:'학점은 순서(등급 체계)는 있지만 <strong>간격이 균일하다고 볼 수 없습니다.</strong> 서열척도입니다.' },
  { ctx:'기상 데이터', val:'연도: 2024년', desc:'"연도 0년"은 실제로 존재하지만, 2024년이 1012년의 "2배"라는 표현은 의미가 없습니다.', ans:2, fb:'연도는 간격이 균일(1년씩)하지만 <strong>"0년"이 절대적 시작점이 아닙니다.</strong> 비율 해석이 불가하므로 등간척도입니다.' },
];

let shuffled = [], cur = 0, score = 0, answered = false;
const catScore = [0,0,0,0];
const catTotal = [0,0,0,0];

function shuffle(arr) {
  const a = [...arr]; for (let i = a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a;
}

function restart() {
  shuffled = shuffle(QS); cur = 0; score = 0; answered = false;
  for(let i=0;i<4;i++){catScore[i]=0;catTotal[i]=0;}
  document.getElementById('result-card').classList.remove('visible');
  document.getElementById('quiz-area').style.display='block';
  renderQ();
}

function renderQ() {
  const q = shuffled[cur];
  const total = shuffled.length;
  document.getElementById('prog-fill').style.width = (cur/total*100)+'%';
  document.getElementById('prog-text').textContent = cur + ' / ' + total + ' 완료';
  document.getElementById('score-text').textContent = '정답 ' + score + '개';
  document.getElementById('q-num').textContent = '문제 ' + (cur+1) + ' / ' + total;
  document.getElementById('q-context').textContent = '📂 ' + q.ctx;
  document.getElementById('q-value').textContent = q.val;
  document.getElementById('q-desc').textContent = q.desc;

  const opts = document.getElementById('options');
  opts.innerHTML = OPTS.map((o,i) => `
    <button class="opt-btn" onclick="answer(${i})" id="opt-${i}">
      <div class="opt-num" style="background:${o.color}">${i+1}</div>
      <div><div class="opt-text">${o.label}</div><div class="opt-sub">${o.sub}</div></div>
    </button>`).join('');

  const fb = document.getElementById('feedback');
  fb.className = 'feedback'; fb.innerHTML = '';
  const nb = document.getElementById('next-btn');
  nb.className = 'next-btn';
  answered = false;
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const q = shuffled[cur];
  const correct = idx === q.ans;
  if (correct) { score++; catScore[q.ans]++; }
  catTotal[q.ans]++;

  OPTS.forEach((_,i) => {
    const btn = document.getElementById('opt-'+i);
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
    else if (i === idx && !correct) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback visible ' + (correct?'ok':'fail');
  fb.innerHTML = (correct ? '✅ <div><strong>정답!</strong> ' : '❌ <div><strong>오답.</strong> 정답은 <strong>'+OPTS[q.ans].label+'</strong>입니다. ') + q.fb + '</div>';
  document.getElementById('next-btn').className = 'next-btn visible';
}

function nextQ() {
  cur++;
  if (cur >= shuffled.length) { showResult(); return; }
  renderQ();
}

function showResult() {
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-text').textContent = shuffled.length + ' / ' + shuffled.length + ' 완료';
  document.getElementById('score-text').textContent = '정답 ' + score + '개';
  document.getElementById('quiz-area').style.display = 'none';

  const pct = Math.round(score/shuffled.length*100);
  let grade, gbg, gcol;
  if (pct>=90){grade='척도 마스터 🏆';gbg='#1A1917';gcol='#fff';}
  else if (pct>=70){grade='잘 이해했어요 👍';gbg='var(--c2-bg)';gcol='var(--c2-dark)';}
  else if (pct>=50){grade='조금 더 복습해요 📖';gbg='var(--c3-bg)';gcol='var(--c3-dark)';}
  else{grade='척도_분류.html을 다시 보세요 💪';gbg='var(--c4-bg)';gcol='var(--c4-dark)';}

  document.getElementById('res-score').textContent = score + ' / ' + shuffled.length;
  document.getElementById('res-label').textContent = '정답률 ' + pct + '%';
  document.getElementById('res-grade').style.cssText = `background:${gbg};color:${gcol};`;
  document.getElementById('res-grade').textContent = grade;

  const cats = ['명목','서열','등간','비율'];
  const bgs = ['var(--c1-bg)','var(--c2-bg)','var(--c3-bg)','var(--c4-bg)'];
  const darks = ['var(--c1-dark)','var(--c2-dark)','var(--c3-dark)','var(--c4-dark)'];
  document.getElementById('res-breakdown').innerHTML = cats.map((c,i)=>`
    <div class="rb-cell" style="background:${bgs[i]}">
      <div class="rb-label" style="color:${darks[i]}">${c}</div>
      <div class="rb-val" style="color:${darks[i]}">${catTotal[i]?catScore[i]+'/'+catTotal[i]:'—'}</div>
    </div>`).join('');

  document.getElementById('result-card').classList.add('visible');
}

restart();
</script>
</body>
</html>
